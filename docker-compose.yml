services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cf}
      POSTGRES_DB: ${POSTGRES_DB:-content_factory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cf} -d ${POSTGRES_DB:-content_factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./runs:/app/runs
      - ./inputs:/app/inputs
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
      - ./prompts:/app/prompts
    # На `up` фабрика сама прогоняет конвейер и наполняет БД (идемпотентно:
    # повторный up не пересчитывает готовое). Вьювер показывает результат.
    command: ["python", "src/orchestrator.py", "--input", "inputs/transcript.txt"]

  viewer:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
    ports:
      - "8000:8000"
    working_dir: /app/src
    command: ["uvicorn", "viewer:app", "--host", "0.0.0.0", "--port", "8000"]

  panel:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
      - ./prompts:/app/prompts
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]

volumes:
  pgdata:
