run:
  scenarios: 3
  language: ru
  workers: 3

# Модели на стадию. Дефолт — проверенные рабочие free-тиры OpenRouter (июнь 2026).
# Если стадия ловит 429/402/404 — подставь другую из блока "Альтернативы" ниже.
models:
  planner:    "openai/gpt-oss-120b:free"
  researcher: "openai/gpt-oss-120b:free"
  writer:     "openai/gpt-oss-120b:free"
  editor:     "openai/gpt-oss-120b:free"
  seo:        "openai/gpt-oss-120b:free"

# Альтернативы (проверены на 200 при $0, июнь 2026) — раскомментируй и подставь:
#   Топ-качество : openai/gpt-oss-120b:free
#                  nvidia/nemotron-3-super-120b-a12b:free
#   Баланс       : openai/gpt-oss-20b:free            # дефолт, тянул полный прогон
#                  google/gemma-4-31b-it:free
#   Быстрые      : google/gemma-4-26b-a4b-it:free     # MoE, шустрый
#                  nvidia/nemotron-nano-9b-v2:free    # лёгкий
#   Мерцают (429): meta-llama/llama-3.3-70b-instruct:free
#                  qwen/qwen3-next-80b-a3b-instruct:free
#                  nousresearch/hermes-3-llama-3.1-405b:free
# Свежий список:  curl -s https://openrouter.ai/api/v1/models | ... | grep ':free'

# Запасные модели: если стадийная модель отдаёт 429/пусто/сетевую ошибку,
# клиент по очереди пробует эти (все проверены на 200 при $0, июнь 2026).
model_fallbacks:
  - "openai/gpt-oss-20b:free"
  - "google/gemma-4-31b-it:free"
  - "google/gemma-4-26b-a4b-it:free"

limits:
  # Статья допускает структурный лонгрид с таблицами (эталон S2-02 ~3400-4160 симв).
  article_chars: [800, 4500]
  post_words:    [100, 300]

style:
  blacklist:
    - "всем привет"
    - "сегодня расскажу"
    - "давайте"
    - "надеюсь, было полезно"
    - "подписывайтесь"
    - "уникальный"
    - "инновационный"
    - "в этой статье мы"
    - "давайте разберемся"
    - "стоит отметить"
    - "является важным"
  require_number_in_first_screen: true
  hashtags_as_single_block: true
  no_caps_for_claude: true
  max_sentence_words: 40
  # Голос на формат: задаёт editor'у разный регистр для статьи и поста.
  # Если убрать/закомментировать — берутся дефолты из stages/editor.py
  # (ARTICLE_VOICE / POST_VOICE).
  voice:
    article: >-
      ГОЛОС СТАТЬИ: развёрнутый экспертный материал. Смысловые подзаголовки
      (##), при необходимости таблицы и списки. Ключевые термины и цифры —
      **жирным**. Нейтрально-экспертный тон. БЕЗ эмодзи и БЕЗ хештегов. В
      конце — практический раздел «Что попробовать у себя» или содержательный
      вывод. Заметно длиннее и обстоятельнее поста.
    post: >-
      ГОЛОС ПОСТА: компактный текст 100–300 слов, 3–5 коротких абзацев.
      Заголовок с цифрой в первом экране. Тот же профессиональный тон, что и в
      статье, но плотнее. Ключевые термины — **жирным**. БЕЗ эмодзи и
      разговорных призывов-вопросов. В самом конце — блок хештегов одной
      строкой и мягкий мостик «Подробный разбор — в статье». Заметно короче
      статьи.

llm:
  max_retries: 2
  max_tokens: 4000

# Все провайдеры бесплатные, без ключей (duckduckgo / wikipedia / auto-chain).
research:
  web_search: true
  provider: auto
  max_results: 5
